<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 松萝 / Liana 应用图标「光标抽芽」：文本光标是茎，长出卷须与两片叶——输入即生长。 -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/>
      <stop offset="1" stop-color="#E8E0CB"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0E5644"/>
      <stop offset="1" stop-color="#239A6C"/>
    </linearGradient>
    <linearGradient id="curl" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#239A6C"/>
      <stop offset="1" stop-color="#3CBF86"/>
    </linearGradient>
    <linearGradient id="leafL" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1C8A60"/>
      <stop offset="1" stop-color="#86E0B0"/>
    </linearGradient>
    <linearGradient id="leafR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1C8A60"/>
      <stop offset="1" stop-color="#7AD9A6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3A2E12" flood-opacity="0.26"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B3D2E" flood-opacity="0.22"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="380" fill="url(#hl)" opacity="0.6"/></g>
  <g filter="url(#soft)" transform="translate(-6 14)">
    <!-- 卷须 -->
    <path d="M512 360 C 512 268, 596 236, 656 270 C 710 302, 696 378, 640 376 C 600 374, 598 328, 628 322"
          stroke="url(#curl)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <!-- 叶 -->
    <path d="M500 470 C 410 472, 348 420, 334 340 C 418 334, 488 388, 500 470 Z" fill="url(#leafL)"/>
    <path d="M500 470 C 456 430, 410 392, 360 366" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M524 566 C 612 570, 678 522, 698 444 C 616 436, 540 486, 524 566 Z" fill="url(#leafR)"/>
    <path d="M524 566 C 568 530, 620 490, 676 462" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- 光标茎 + 底座 -->
    <rect x="490" y="338" width="44" height="420" rx="22" fill="url(#stem)"/>
    <rect x="428" y="738" width="168" height="42" rx="21" fill="#0E5644"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>
</svg>
