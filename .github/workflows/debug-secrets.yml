# 临时诊断工作流：验证签名 secrets 在 CI 侧的可用性（只输出长度与校验结果，绝不输出值）
name: Debug Signing Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 校验 secrets
        env:
          LIANA_KEYSTORE_BASE64: ${{ secrets.LIANA_KEYSTORE_BASE64 }}
          LIANA_RELEASE_STORE_PASSWORD: ${{ secrets.LIANA_RELEASE_STORE_PASSWORD }}
          LIANA_RELEASE_KEY_ALIAS: ${{ secrets.LIANA_RELEASE_KEY_ALIAS }}
          LIANA_RELEASE_KEY_PASSWORD: ${{ secrets.LIANA_RELEASE_KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_BASE64 长度: ${#LIANA_KEYSTORE_BASE64}"
          echo "STORE_PASSWORD 长度: ${#LIANA_RELEASE_STORE_PASSWORD}"
          echo "KEY_ALIAS 长度: ${#LIANA_RELEASE_KEY_ALIAS}"
          echo "KEY_PASSWORD 长度: ${#LIANA_RELEASE_KEY_PASSWORD}"
          echo "$LIANA_KEYSTORE_BASE64" | base64 -d > /tmp/ks
          echo "keystore 字节数: $(wc -c < /tmp/ks)"
          sha256sum /tmp/ks | awk '{print "keystore sha256:", $1}'
          if keytool -list -keystore /tmp/ks -storepass "$LIANA_RELEASE_STORE_PASSWORD" -alias "$LIANA_RELEASE_KEY_ALIAS" >/tmp/kt.out 2>&1; then
            echo "STORE_PASSWORD + ALIAS 验证: ✅ OK"
            grep -E "PrivateKeyEntry|fingerprint" /tmp/kt.out | head -2
          else
            echo "STORE_PASSWORD + ALIAS 验证: ❌ FAIL"; cat /tmp/kt.out | sed 's/\(密码\|password\).*/[略]/'
          fi
          if keytool -list -keystore /tmp/ks -storepass "$LIANA_RELEASE_STORE_PASSWORD" >/dev/null 2>&1 \
            && keytool -keypasswd -keystore /tmp/ks -alias "$LIANA_RELEASE_KEY_ALIAS" \
                 -storepass "$LIANA_RELEASE_STORE_PASSWORD" -keypass "$LIANA_RELEASE_KEY_PASSWORD" \
                 -new "$LIANA_RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "KEY_PASSWORD 验证: ✅ OK"
          else
            echo "KEY_PASSWORD 验证: ❌ FAIL"
          fi
