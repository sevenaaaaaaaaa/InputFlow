# 临时诊断工作流：验证签名 secrets 在 CI 侧的可用性（只输出长度与校验结果，绝不输出值）
name: Debug Signing Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 校验 secrets
        env:
          LIANA_KEYSTORE_BASE64: ${{ secrets.LIANA_KEYSTORE_BASE64 }}
          LIANA_RELEASE_STORE_PASSWORD: ${{ secrets.LIANA_RELEASE_STORE_PASSWORD }}
          LIANA_RELEASE_KEY_ALIAS: ${{ secrets.LIANA_RELEASE_KEY_ALIAS }}
          LIANA_RELEASE_KEY_PASSWORD: ${{ secrets.LIANA_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$LIANA_KEYSTORE_BASE64" | base64 -d > /tmp/ks
          if [[ "$LIANA_RELEASE_STORE_PASSWORD" == "$LIANA_RELEASE_KEY_PASSWORD" ]]; then
            echo "两个密码 secret: SAME"
          else
            echo "两个密码 secret: DIFFERENT ← 问题在这"
          fi
          cat > /tmp/keyread.jsh <<'EOF'
          var ks = java.security.KeyStore.getInstance("PKCS12");
          try (var f = new java.io.FileInputStream("/tmp/ks")) { ks.load(f, System.getenv("SP").toCharArray()); }
          var key = ks.getKey(System.getenv("AL"), System.getenv("KP").toCharArray());
          System.out.println(key == null ? "KEY NULL" : "KEY OK " + key.getAlgorithm());
          EOF
          for label in STORE_PASSWORD KEY_PASSWORD; do
            if [[ "$label" == "STORE_PASSWORD" ]]; then KP="$LIANA_RELEASE_STORE_PASSWORD"; else KP="$LIANA_RELEASE_KEY_PASSWORD"; fi
            if SP="$LIANA_RELEASE_STORE_PASSWORD" AL="$LIANA_RELEASE_KEY_ALIAS" KP="$KP" \
               jshell --execution local -q /tmp/keyread.jsh 2>/dev/null | grep -q "KEY OK"; then
              echo "getKey(alias, $label): ✅ OK"
            else
              echo "getKey(alias, $label): ❌ FAIL"
            fi
          done
